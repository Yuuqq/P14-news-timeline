<!doctype html>
<html lang="zh-CN">

<head>
  <meta charset="utf-8" />
  <link rel="icon" href="./favicon.svg" type="image/svg+xml" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#F0E6CF" media="(prefers-color-scheme: light)" />
  <meta name="theme-color" content="#241B11" media="(prefers-color-scheme: dark)" />
  <meta name="color-scheme" content="light dark" />
  <title>P14 交互式突发新闻时间轴</title>
  <link rel="stylesheet" href="../shared/design-tokens.css" />
  <link rel="stylesheet" href="../shared/modern-styles.css" />
  <link rel="stylesheet" href="../shared/tool-chrome.css" />
  <link rel="stylesheet" href="./styles.css" />
  <meta name="description" content="交互式突发新闻时间轴。P14 交互式突发新闻时间轴" />
  <meta property="og:title" content="P14 交互式突发新闻时间轴" />
  <meta property="og:description" content="交互式突发新闻时间轴 — 前端纯静态新闻工具" />
  <meta property="og:type" content="website" />
  <meta property="og:url" content="https://yuuqq.github.io/P14-news-timeline/" />
  <link rel="manifest" href="./manifest.json" />
</head>

<body>
  <a href="#main" class="skip-link">跳到主内容</a>
  <div class="app" id="app">
    <header class="tool-chrome" data-tool-id="P14">
      <a class="tool-chrome__mark" href="../P00-dashboard/">新闻实验工具</a>
      <span class="tool-chrome__id">P14</span>
    </header>

    <details class="tool-teach">
      <summary>如何使用</summary>
      <p>时间轴是突发新闻报道的核心可视化工具。它帮助读者看清事件顺序和关键转折，可用于危机进程、政策演变和案件进展。</p>
      <p>在「时间轴 JSON」里编辑事件数组（date、title、desc、color），点「渲染时间线」生成叙事。也可以添加事件、删除单条，或导出 JSON 与 PNG。示例数据只供课堂练习。</p>
    </details>

    <main id="main" aria-label="主内容区域">
      <header class="hero">
        <h1>交互式突发新闻时间轴</h1>
        <p>编辑 JSON 事件数据，自动生成可滚动时间线叙事页面。</p>
      </header>

      <section class="card editor">
        <label for="jsonInput">时间轴 JSON</label>
        <textarea id="jsonInput" rows="12" spellcheck="false"></textarea>
        <div class="actions">
          <button id="renderBtn" type="button">渲染时间线</button>
          <button id="addBtn" type="button" class="btn-secondary">添加事件</button>
          <button id="exportBtn" type="button" class="btn-secondary">导出 JSON</button>
          <button id="exportPngBtn" type="button" class="btn-secondary" data-target="timeline">导出 PNG</button>
        </div>
        <p id="status" role="status" aria-live="polite">状态: 等待渲染</p>
      </section>

      <section id="timeline" class="timeline" aria-label="时间线"></section>
    </main>

    <footer class="tool-footer">
      数据边界以附录 A 为准：能在本机完成的计算不主动外发；示例数据仅供课堂；本工具输出不得单独当作结论。
      <a href="../P00-dashboard/">返回工具箱</a>
    </footer>
  </div>
  <script src="./pm-metrics.js" defer></script>
  <script src="./app.js" defer></script>
  <script src="../shared/releases/v2.6/loader.js" data-modules="dark,export-png,cmd,toast,onboarding,url-state,pedagogy-p1,pedagogy-p2,nav,kbd"></script>
  <script>if('serviceWorker' in navigator){navigator.serviceWorker.register('./sw.js').catch(()=>{})}</script>
</body>

</html>
