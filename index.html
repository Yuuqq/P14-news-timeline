<!doctype html>
<html lang="zh-CN">

<head>
  <meta charset="utf-8" />
  <link rel="icon"
    href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>📰</text></svg>" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>P14 交互式突发新闻时间轴</title>
  <link rel="stylesheet" href="../shared/design-tokens.css" />
  <link rel="stylesheet" href="./styles.css" />
  <meta name="description" content="交互式突发新闻时间轴。P14 交互式突发新闻时间轴" />
  <meta property="og:title" content="P14 交互式突发新闻时间轴" />
  <meta property="og:description" content="交互式突发新闻时间轴 — 前端纯静态新闻工具" />
  <meta property="og:type" content="website" />
  <meta property="og:url" content="https://yuuqq.github.io/P14-news-timeline/" />
</head>

<body>
  <main class="app">
    <header class="hero">
      <h1>交互式突发新闻时间轴</h1>
      <p>编辑 JSON 事件数据，自动生成可滚动时间线叙事页面。</p>
    </header>

    <section class="card">
      <label for="jsonInput">时间轴 JSON</label>
      <textarea id="jsonInput" rows="12"></textarea>
      <div class="actions">
        <button id="renderBtn" type="button">渲染时间线</button>
        <button id="addBtn" type="button" class="btn-secondary">➕ 添加事件</button>
        <button id="exportBtn" type="button" class="btn-secondary">导出 JSON</button>
      </div>
      <p id="status" aria-live="polite">状态: 等待渲染</p>
    </section>

    <section id="timeline" class="timeline"></section>
  </main>
  <script src="./pm-metrics.js" defer></script>
  <script src="./app.js" defer></script>

  <!-- Privacy Notice -->
  <div style="text-align:center;padding:12px 16px;font-size:12px;color:#888;border-top:1px solid #eee;margin-top:24px;">
    🔒 隐私提示：本工具所有数据处理均在您的浏览器本地完成，不会上传任何数据至服务器。
  </div>

  <!-- Cross-Project Navigation -->
  <nav
    style="display:flex;justify-content:space-between;align-items:center;padding:10px 16px;font-size:13px;border-top:1px solid #e5e5e5;margin-top:16px;color:#666;">
    <a href="https://yuuqq.github.io/_codex/" style="text-decoration:none;">📋 工具箱导航</a>
    <span style="opacity:.4">P14</span>
  </nav>
</body>

</html>
