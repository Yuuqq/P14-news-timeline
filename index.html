  <link rel="stylesheet" href="../shared/design-tokens.css" />
  <link rel="stylesheet" href="./styles.css" />
  <meta name="description" content="交互式突发新闻时间轴。P14 交互式突发新闻时间轴" />

<style media="print">
.gnav,.pedagogy-panel,.explore-section,[class*="dark-toggle"],button[aria-label]{display:none!important}
body{background:#fff!important;color:#000!important;font-size:11pt}
.app,main,.container{box-shadow:none!important;border:none!important;padding:0!important}
a{color:#000!important;text-decoration:underline}
a[href]::after{content:" (" attr(href) ")";font-size:9pt;color:#666}
@page{margin:2cm}
</style>
</head>

<body>
  <main aria-label="主内容区域" class="app">
    <header class="hero">
      <h1>交互式突发新闻时间轴</h1>
      <p>编辑 JSON 事件数据，自动生成可滚动时间线叙事页面。</p>
    </header>

    <section class="card">
      <details class="teach-card" open>
        <summary>🎓 时间轴叙事与突发新闻</summary>
        <p>时间轴是突发新闻报道的核心可视化工具。它可以帮助读者快速理解事件发展顺序，捕捉关键转折点。其应用场景包括危机管理可视化、政策演变追踪、司法案件进展研判等。</p>
      </details>
    </section>

    <section class="card">
      <label for="jsonInput">时间轴 JSON</label>
      <textarea id="jsonInput" rows="12"></textarea>
      <div class="actions">
        <button id="renderBtn" type="button" aria-label="render">渲染时间线</button>
        <button id="addBtn" type="button" class="btn-secondary" aria-label="add">➕ 添加事件</button>
        <button id="exportBtn" type="button" class="btn-secondary" aria-label="export">导出 JSON</button>
        <button id="exportPngBtn" type="button" class="btn-secondary" data-target="timeline" aria-label="导出 PNG">📸 导出 PNG</button>
      </div>
      <p id="status" role="status" aria-live="polite">状态: 等待渲染</p>
    </section>

    <section id="timeline" class="timeline"></section>
  </main>
  <script src="./pm-metrics.js" defer></script>
  <script src="./app.js" defer></script>

  <!-- Privacy Notice -->
  <div style="text-align:center;padding:12px 16px;font-size:12px;color:#888;border-top:1px solid #eee;margin-top:24px;">
    🔒 隐私提示：本工具所有数据处理均在您的浏览器本地完成，不会上传任何数据至服务器。
  </div>

  <!-- Cross-Project Navigation -->
  <nav aria-label="工具箱导航"
    style="display:flex;justify-content:space-between;align-items:center;padding:10px 16px;font-size:13px;border-top:1px solid #e5e5e5;margin-top:16px;color:#666;">
    <a href="https://yuuqq.github.io/journalism-toolbox/" style="text-decoration:none;">📋 工具箱导航</a>
    <span style="opacity:.4">P14</span>
  </nav>
  <script src="../shared/dark-toggle.js" defer></script>
  <script src="../shared/export-png.js" defer></script>
  <script>if('serviceWorker' in navigator){navigator.serviceWorker.register('./sw.js').catch(()=>{})}</script>
  <script src="../shared/cmd-palette.js" defer></script>
  <script src="../shared/toast.js" defer></script>
  <script src="../shared/onboarding.js" defer></script>
  <script src="../shared/url-state.js" defer></script>

  <script src="../shared/pedagogy-data-p1.js" defer></script>
  <script src="../shared/pedagogy-data-p2.js" defer></script>
  <script src="../shared/global-nav.js" defer></script>
  <script src="../shared/kbd-hints.js" defer></script>
</body>

</html>
